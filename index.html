<html lang="en" id="top">

        <script>
            // Apply a stored theme before first paint so there is no flash.
            try {
                var t = localStorage.getItem('sis-theme');
                if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
            } catch (e) {}
        </script>
